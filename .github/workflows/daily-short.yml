name: daily-short-upload

on:
  schedule:
    # 23:00 UTC = 7:00 PM New York (US prime time) = 04:45 Kathmandu
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (download + render, skip uploads)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yt-short
  cancel-in-progress: false

jobs:
  upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run short-video slot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Brutal Reality' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python -m pipeline.main --slot short
