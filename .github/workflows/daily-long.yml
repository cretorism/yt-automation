name: daily-long-upload

on:
  schedule:
    # 16:00 UTC = 12:00 PM New York = 21:45 Kathmandu
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (download + render, skip uploads)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yt-long
  cancel-in-progress: false

jobs:
  upload-long:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run long-video slot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Brutal Reality' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python -m pipeline.main --slot long
